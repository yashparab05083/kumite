[package]
name = "kumite_server"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "=0.7.5"
tokio = { version = "=1.38.0", features = ["full"] }
tower-http = { version = "=0.5.2", features = ["fs", "trace", "cors", "compression-full", "set-status"] }
tower = "=0.4.13"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.120"
tokio-postgres = { version = "=0.7.10", features = ["runtime"] }
postgres-native-tls = "=0.5.0"
native-tls = "=0.2.12"
base64 = "=0.22.1"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
chrono = { version = "=0.4.38", features = ["serde"] }
http = "=1.1.0"
sha2 = "=0.10.8"
block-buffer = "=0.10.4"
digest = "=0.10.7"
crypto-common = "=0.1.7"
md-5 = "=0.10.6"
hmac = "=0.12.1"
rand = "=0.8.5"
rand_core = "=0.6.4"
getrandom = "=0.2.15"
cpufeatures = "=0.2.14"
